{% extends "base.html" %}
{% block title %}My Settings | Peach Suite Pro{% endblock %}

{% block content %}


<h1>My Settings</h1>

<p>
    Choose your preferred language for Help pages and future SMS/Email messaging defaults.
</p>

<form method="POST" class="styled-form">

    <label>Preferred Language</label><br>

    <select name="preferred_language" class="form-control" style="max-width:300px;">
        <option value="EN" {% if preferred_language == "EN" %}selected{% endif %}>
            English
        </option>

        <option value="ES" {% if preferred_language == "ES" %}selected{% endif %}>
            Spanish
        </option>
    </select>

    <br><br>

    <button type="submit" class="btn btn-primary">
        Save Settings
    </button>

</form>

{% endblock %}
