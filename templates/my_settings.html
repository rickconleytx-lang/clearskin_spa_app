{% extends "base.html" %}
{% block title %}My Settings | Peach Suite Pro{% endblock %}

{% block content %}

<a href="javascript:history.back()"
       style="
            display:inline-block;
            padding:2px 8px;
            font-size:11px;
            font-weight:600;
            text-decoration:none;
            color:#555;
            background:#f7f7f7;
            border:1px solid #d9d9d9;
            border-radius:12px;
            white-space:nowrap;
            transition:all .2s;">
        ← Back
    </a>

<h1>My Settings</h1>

<p>
    Choose your preferred language for Help pages and future SMS/Email messaging defaults.
</p>

<form method="POST" class="styled-form">

    <label>Preferred Language</label><br>

    <select name="preferred_language" class="form-control" style="max-width:300px;">
        <option value="EN" {% if preferred_language == "EN" %}selected{% endif %}>
            English
        </option>

        <option value="ES" {% if preferred_language == "ES" %}selected{% endif %}>
            Spanish
        </option>
    </select>

    <br><br>

    <button type="submit" class="btn btn-primary">
        Save Settings
    </button>

</form>

{% endblock %}
