{% extends "base.html" %}

{% block title %}Add Compensation Type | Peach Suite Pro{% endblock %}

{% block content %}

<div class="page-tool-pills">
    <a href="javascript:history.back()" class="tool-pill">← Back</a>
    <button type="button" class="tool-pill" onclick="openQLaunch()">
        ⚡️ Q Launch
    </button>
    <a href="{{ url_for('view_help_page', page_key='system_activity') }}" class="tool-pill">❓ Help</a>
    <a href="{{ url_for('feedback') }}" class="tool-pill">✉️ Feedback</a>
</div> 
<br>

<h1>Add Compensation Type</h1>

<form method="POST">
    <div class="form-group">
        <label for="compensation_type_name">Compensation Type Name</label>
        <input type="text"
               id="compensation_type_name"
               name="compensation_type_name"
               value="{{ request.form.get('compensation_type_name', '') }}"
               required>
    </div>

    <div class="form-buttons">
        <button type="submit" class="btn">Save</button>
        <a href="{{ url_for('compensation_types_report') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
