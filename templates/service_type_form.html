{% extends "base.html" %}

{% if service %}
    {% set page_title = "Edit Service Type" %}
{% else %}
    {% set page_title = "Add Service Type" %}
{% endif %}

{% block title %}{{ page_title }} | Peach Suite Pro{% endblock %}

{% block content %}

<h1>{{ page_title }}</h1>

<form method="POST">

    <label for="service_name">
        Service Name<span style="color: red;"> *</span>
    </label>

    <input type="text"
           id="service_name"
           name="service_name"
           value="{{ service[1] if service else '' }}"
           required>

    <label for="default_duration_minutes">
        Default Session Length<span style="color: red;"> *</span>
    </label>

    <input type="number"
           id="default_duration_minutes"
           name="default_duration_minutes"
           min="1"
           step="1"
           placeholder="Minutes"
           value="{{ service[2] if service and service[2] is not none else '' }}"
           required>

    <label for="default_price">
        Default Service Price<span style="color: red;"> *</span>
    </label>

    <input type="number"
           id="default_price"
           name="default_price"
           min="0"
           step="0.01"
           placeholder="0.00"
           value="{{ service[3] if service and service[3] is not none else '' }}"
           required>

    <label for="is_active">Status</label>

    <select id="is_active" name="is_active">
        <option value="1"
                {% if not service or service[4] %}selected{% endif %}>
            Active
        </option>

        <option value="0"
                {% if service and not service[4] %}selected{% endif %}>
            Inactive
        </option>
    </select>

    <br><br>

    <button type="submit" class="btn">
        {% if service %}
            Save Changes
        {% else %}
            Add Service Type
        {% endif %}
    </button>

    <a href="{{ url_for('service_types') }}" class="btn">
        Cancel
    </a>

</form>

{% endblock %}
