{% extends "base.html" %}

{% block content %}



<h1>Add Income</h1>

<p><strong>Name:</strong> {{ appt[4] }} {{ appt[5] }}</p>
<p><strong>Date:</strong> {{ appt[2].strftime('%B %-d, %Y') }}</p>
<p><strong>Time:</strong> {{ appt[3].strftime('%I:%M %p').lstrip('0') }}</p>

<span style="color: red; font-size: x-small;">* Required Field</span>

<form method="POST">
    <input
        type="hidden"
        id="square_payment_id"
        name="square_payment_id"
        value=""
    >
    <input
        type="hidden"
        id="square_line_classifications"
        name="square_line_classifications"
        value="{}"
    >
    <input
        type="hidden"
        id="square_different_payer_confirmed"
        name="square_different_payer_confirmed"
        value=""
    >
    <input
        type="hidden"
        id="square_confirmed_payer_customer_id"
        name="square_confirmed_payer_customer_id"
        value=""
    >

    <label for="income_date">Income Date<span style="color: red;"> *</span></label>
    <input type="date" id="income_date" name="income_date"
           value="{{ appt[2].strftime('%Y-%m-%d') }}" required>

    <label for="income_type">Income Type<span style="color: red;"> *</span></label>
    <select id="income_type" name="income_type" required>
        <option value="Service">Service</option>
        <option value="Retail">Retail</option>
        <option value="Service + Retail">Service + Retail</option>
    </select>

    <label for="description">Description</label>
    <input type="text" id="description" name="description"
           placeholder="Signature Facial, Product Sale, etc.">

    <div class="form-group">
        <label for="employee_id">Employee<span style="color: red;"> *</span></label>
        <select name="employee_id" id="employee_id" required>
            <option value="">Select Employee</option>
            {% for emp in employees %}
                <option value="{{ emp[0] }}">{{ emp[1] }}</option>
            {% endfor %}
        </select>
    </div>

    <label for="service_amount">Service Amount</label>
    <input type="number" step="0.01" id="service_amount" name="service_amount" placeholder="0.00">

    <label for="retail_amount">Retail Amount</label>
    <input type="number" step="0.01" id="retail_amount" name="retail_amount" placeholder="0.00">

    <label for="available_credit">Available Credit</label>
    <input type="number" step="0.01" id="available_credit" name="available_credit"
       value="{{ '%.2f'|format(credit_balance or 0) }}" readonly>

    <label for="credit_applied">Credit Applied</label>
    <input type="number" step="0.01" min="0" id="credit_applied" name="credit_applied" value="0.00">

    <label for="tax_amount">Tax Amount</label>
    <input type="number" step="0.01" id="tax_amount" name="tax_amount" placeholder="0.00">

    <label for="tip_amount">Tip Amount</label>
    <input type="number" step="0.01" id="tip_amount" name="tip_amount" placeholder="0.00">

    <label for="total_amount">Total Amount</label>
    <input type="number" step="0.01" id="total_amount" name="total_amount" value="0.00" readonly required>

    <label for="payment_method">Payment Method</label>
    <select id="payment_method" name="payment_method" required>
        <option value="">Select Payment Method</option>
        <option value="Cash">Cash</option>
        <option value="Card">Card</option>
        <option value="Apple Pay">Apple Pay</option>
        <option value="Google Pay">Google Pay</option>
        <option value="Square">Square</option>
        <option value="Other">Other</option>
    </select>

    <div id="credit_processor_group" style="display: none;">
        <label for="credit_processor_id">Credit Processor</label>
        <select id="credit_processor_id" name="credit_processor_id">
            <option value="">Select Processor</option>
            {% for processor in credit_processors %}
                <option value="{{ processor[0] }}">{{ processor[1] }}</option>
            {% endfor %}
        </select>
    </div>

    <div id="processor_payment_group" style="display: none;">
        <label for="processor_payment_id">Payment Processor Payment ID</label>
        <input type="text" id="processor_payment_id" name="processor_payment_id">
    </div>

    {% if square_retrieval_connected %}
    <div id="square_retrieve_group" style="display: none; margin-top: 12px;">
        <button
            type="button"
            id="retrieve_square_data"
            class="btn"
            style="background: green; color: white;"
        >
            Retrieve Square Data
        </button>

        <p
            id="square_retrieve_status"
            style="margin-top: 8px;"
        ></p>

        <div id="square_payment_candidates"></div>

        <div
            id="square_payment_preview"
            style="margin-top: 14px;"
        ></div>
    </div>
    {% endif %}

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="4"></textarea>

    <br><br>
    <button
        type="submit"
        id="save_income_button"
        class="btn"
        style="background: green; color: white;"
    >
        Save Income &amp; Continue to Session Notes
    </button>
    <a href="{{ url_for('daily_schedule', date=appt[2].strftime('%Y-%m-%d')) }}" class="btn">Cancel</a>
</form>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const incomeTypeField = document.getElementById("income_type");
    const descriptionField = document.getElementById("description");
    const notesField = document.getElementById("notes");
    const serviceField = document.getElementById("service_amount");
    const retailField = document.getElementById("retail_amount");
    const taxField = document.getElementById("tax_amount");
    const tipField = document.getElementById("tip_amount");
    const creditAppliedField = document.getElementById("credit_applied");
    const availableCreditField = document.getElementById("available_credit");
    const totalField = document.getElementById("total_amount");

    const paymentMethodField = document.getElementById("payment_method");
    const creditProcessorGroup = document.getElementById("credit_processor_group");
    const creditProcessorField = document.getElementById("credit_processor_id");
    const processorPaymentGroup = document.getElementById("processor_payment_group");
    const processorPaymentField = document.getElementById("processor_payment_id");
    const squarePaymentIdField = document.getElementById("square_payment_id");
    const squareLineClassificationsField =
        document.getElementById("square_line_classifications");
    const squareDifferentPayerConfirmedField =
        document.getElementById(
            "square_different_payer_confirmed"
        );
    const squareConfirmedPayerCustomerIdField =
        document.getElementById(
            "square_confirmed_payer_customer_id"
        );
    const squareRetrieveGroup = document.getElementById("square_retrieve_group");
    const retrieveSquareButton = document.getElementById("retrieve_square_data");
    const squareRetrieveStatus = document.getElementById("square_retrieve_status");
    const squarePaymentCandidates = document.getElementById("square_payment_candidates");
    const squarePaymentPreview = document.getElementById("square_payment_preview");
    const saveIncomeButton = document.getElementById("save_income_button");

    let squareReviewButtons = [];
    let squareConfirmedPaymentId = "";
    let squareGeneratedPayerNote = "";

    function clearSquarePayerConfirmation() {
        squareConfirmedPaymentId = "";

        if (squareDifferentPayerConfirmedField) {
            squareDifferentPayerConfirmedField.value = "";
        }

        if (squareConfirmedPayerCustomerIdField) {
            squareConfirmedPayerCustomerIdField.value = "";
        }
    }

    function clearSquareGeneratedPayerNote() {
        if (
            !notesField
            || !squareGeneratedPayerNote
        ) {
            return;
        }

        const generatedNote =
            squareGeneratedPayerNote;

        const noteLines =
            notesField.value.split("\n");

        notesField.value = noteLines
            .filter(function (line) {
                return line !== generatedNote;
            })
            .join("\n");

        // If staff edited that line, the exact generated
        // text will not match and their edit is preserved.
        squareGeneratedPayerNote = "";
    }

    function clearSquarePopulatedState() {
        if (squarePaymentIdField) {
            squarePaymentIdField.value = "";
        }

        if (squareLineClassificationsField) {
            squareLineClassificationsField.value = "{}";
        }

        if (processorPaymentField) {
            processorPaymentField.value = "";
        }

        clearSquareGeneratedPayerNote();

        // If we have left Square, do not leave Square
        // selected as the processor for another payment.
        if (
            paymentMethodField
            && paymentMethodField.value
                .trim()
                .toLowerCase() !== "square"
            && creditProcessorField
            && creditProcessorField.selectedIndex >= 0
        ) {
            const selectedProcessor =
                creditProcessorField.options[
                    creditProcessorField.selectedIndex
                ];

            if (
                selectedProcessor
                && selectedProcessor.textContent
                    .trim()
                    .toLowerCase() === "square"
            ) {
                creditProcessorField.value = "";
            }
        }
    }

    function appendLabeledText(
        parent,
        label,
        value
    ) {
        const strong =
            document.createElement("strong");

        strong.textContent = label;

        parent.appendChild(strong);
        parent.appendChild(
            document.createTextNode(
                " " + String(value || "")
            )
        );
    }

    function setPrimaryAction(button, label = null) {
        if (!button) {
            return;
        }

        button.disabled = false;
        button.style.background = "green";
        button.style.color = "white";
        button.style.cursor = "";

        if (label !== null) {
            button.textContent = label;
        }
    }

    function setSecondaryAction(button, label = null) {
        if (!button) {
            return;
        }

        button.disabled = false;
        button.style.background = "";
        button.style.color = "";
        button.style.cursor = "";

        if (label !== null) {
            button.textContent = label;
        }
    }

    function setCompletedAction(button, label = null) {
        if (!button) {
            return;
        }

        button.disabled = true;
        button.style.background = "#9e9e9e";
        button.style.color = "white";
        button.style.cursor = "not-allowed";

        if (label !== null) {
            button.textContent = label;
        }
    }

    function resetSquareReviewButtons() {
        squareReviewButtons.forEach(function (button) {
            setSecondaryAction(button, "Review Payment");
        });
    }

    function calculateTotal() {
        const service = parseFloat(serviceField.value) || 0;
        const retail = parseFloat(retailField.value) || 0;
        const tax = parseFloat(taxField.value) || 0;
        const tip = parseFloat(tipField.value) || 0;
        const availableCredit = parseFloat(availableCreditField.value) || 0;
        let creditApplied = parseFloat(creditAppliedField.value) || 0;

        const discountableTotal = service + retail;

        if (creditApplied < 0) {
            creditApplied = 0;
        }

        if (creditApplied > availableCredit) {
            creditApplied = availableCredit;
        }

        if (creditApplied > discountableTotal) {
            creditApplied = discountableTotal;
        }

        creditAppliedField.value = creditApplied.toFixed(2);

        const total = service + retail + tax + tip - creditApplied;
        totalField.value = total.toFixed(2);
    }

    function togglePaymentFields() {
        const paymentMethod = paymentMethodField.value.trim().toLowerCase();
        const cardBasedMethods = ["card", "apple pay", "google pay", "square"];

        if (cardBasedMethods.includes(paymentMethod)) {
            creditProcessorGroup.style.display = "block";

            // Square payment IDs are reconciliation data,
            // not useful staff-facing appointment details.
            // Keep the field/value in the form so the
            // authoritative Square transaction still posts,
            // but do not display the technical ID.
            processorPaymentGroup.style.display =
                paymentMethod === "square"
                    ? "none"
                    : "block";
        } else {
            creditProcessorGroup.style.display = "none";
            creditProcessorField.value = "";
            processorPaymentGroup.style.display = "none";
            document.getElementById("processor_payment_id").value = "";
        }

        if (squareRetrieveGroup) {
            squareRetrieveGroup.style.display =
                paymentMethod === "square"
                    ? "block"
                    : "none";
        }

        if (
            paymentMethod !== "square"
            && squarePaymentIdField
            && squareLineClassificationsField
        ) {
            squarePaymentIdField.value = "";
            squareLineClassificationsField.value = "{}";
            clearSquarePayerConfirmation();
        }

        if (saveIncomeButton) {
            const squareNeedsRetrievedPayment =
                paymentMethod === "square"
                && (
                    !squarePaymentIdField
                    || !squarePaymentIdField.value.trim()
                );

            saveIncomeButton.disabled =
                squareNeedsRetrievedPayment;

            saveIncomeButton.style.background =
                squareNeedsRetrievedPayment
                    ? "#9e9e9e"
                    : "green";

            saveIncomeButton.style.color = "white";
            saveIncomeButton.style.cursor =
                squareNeedsRetrievedPayment
                    ? "not-allowed"
                    : "";
        }
    }

    function moneyFromCents(cents) {
        return (
            (Number(cents) || 0) / 100
        ).toFixed(2);
    }

    async function previewSquarePayment(
        paymentId,
        lineClassifications = null,
        reviewButton = null
    ) {
        if (!squarePaymentPreview) {
            return;
        }

        if (
            squareConfirmedPaymentId
            && squareConfirmedPaymentId !== paymentId
        ) {
            clearSquarePayerConfirmation();
        }

        squarePaymentPreview.textContent =
            "Loading selected Square payment...";

        clearSquarePopulatedState();
        togglePaymentFields();

        try {
            const baseUrl =
                "{{ url_for(
                    'square_payment_preview_for_income',
                    appointment_id=appt[0]
                ) }}";

            const params = new URLSearchParams();
            params.append("payment_id", paymentId);

            if (lineClassifications) {
                Object.entries(
                    lineClassifications
                ).forEach(function ([lineUid, value]) {
                    if (value === "service") {
                        params.append(
                            "service_line_uid",
                            lineUid
                        );
                    } else if (value === "retail") {
                        params.append(
                            "retail_line_uid",
                            lineUid
                        );
                    }
                });
            }

            const response = await fetch(
                baseUrl + "?" + params.toString()
            );

            const data = await response.json();

            if (!response.ok || !data.ok) {
                throw new Error(
                    data.error
                    || "Unable to review Square payment."
                );
            }

            const payment = data.payment;
            const appointment = data.appointment || {};

            const payerConfirmationStillValid = Boolean(
                payment.different_square_customer
                && squareConfirmedPaymentId
                    === payment.payment_id
                && squareDifferentPayerConfirmedField
                && squareDifferentPayerConfirmedField.value
                    === "1"
                && squareConfirmedPayerCustomerIdField
                && squareConfirmedPayerCustomerIdField.value
                    === String(payment.customer_id || "")
            );

            let payerConfirmed = Boolean(
                !payment.different_square_customer
                || payerConfirmationStillValid
            );

            let nextSquareActionButton = null;

            if (reviewButton) {
                setCompletedAction(
                    reviewButton,
                    "Payment Reviewed ✓"
                );
            }

            squarePaymentPreview.textContent = "";

            const heading = document.createElement("h3");
            heading.textContent = "Square Payment Preview";
            squarePaymentPreview.appendChild(heading);

            const summary = document.createElement("p");

            summary.textContent =
                `Total $${moneyFromCents(
                    payment.total_amount_cents
                )}`
                + ` • Tax $${moneyFromCents(
                    payment.tax_amount_cents
                )}`
                + ` • Tip $${moneyFromCents(
                    payment.tip_amount_cents
                )}`
                + ` • Square Fee $${moneyFromCents(
                    payment.processing_fee_cents
                )}`
                + ` • Net $${moneyFromCents(
                    payment.net_received_cents
                )}`;

            squarePaymentPreview.appendChild(summary);

            if (payment.different_square_customer) {
                const payerCard =
                    document.createElement("div");

                payerCard.style.padding = "12px";
                payerCard.style.marginTop = "12px";
                payerCard.style.marginBottom = "12px";
                payerCard.style.border =
                    "1px solid #d7a600";
                payerCard.style.borderRadius = "6px";

                const payerHeading =
                    document.createElement("p");

                payerHeading.style.margin =
                    "0 0 8px 0";

                payerHeading.textContent =
                    "Different Payer";

                payerHeading.style.fontWeight =
                    "bold";

                payerCard.appendChild(
                    payerHeading
                );

                const appointmentText =
                    document.createElement("p");

                appointmentText.style.margin =
                    "0 0 6px 0";

                appendLabeledText(
                    appointmentText,
                    "Service Recipient:",
                    appointment.name || ""
                );

                payerCard.appendChild(
                    appointmentText
                );

                const appointmentWhen =
                    document.createElement("p");

                appointmentWhen.style.margin =
                    "0 0 6px 0";

                let displayDate =
                    appointment.date || "";

                if (displayDate) {
                    const dateParts =
                        displayDate.split("-");

                    if (dateParts.length === 3) {
                        const localDate =
                            new Date(
                                Number(dateParts[0]),
                                Number(dateParts[1]) - 1,
                                Number(dateParts[2])
                            );

                        displayDate =
                            localDate.toLocaleDateString(
                                undefined,
                                {
                                    month: "long",
                                    day: "numeric",
                                    year: "numeric"
                                }
                            );
                    }
                }

                appendLabeledText(
                    appointmentWhen,
                    "Appointment:",
                    displayDate
                    + (
                        appointment.time
                            ? " at "
                                + appointment.time
                            : ""
                    )
                );

                payerCard.appendChild(
                    appointmentWhen
                );

                const payerText =
                    document.createElement("p");

                payerText.style.margin =
                    "0 0 6px 0";

                const payerName =
                    payment.possible_payer_name
                    || "Another Square Customer";

                appendLabeledText(
                    payerText,
                    "Square Customer / Possible Payer:",
                    payerName
                );

                payerCard.appendChild(
                    payerText
                );

                const explanation =
                    document.createElement("p");

                explanation.style.margin =
                    "0 0 10px 0";

                explanation.textContent =
                    "This Square payment is associated "
                    + "with someone other than the "
                    + "service recipient. Confirm that "
                    + "this payment should be used for "
                    + "this appointment.";

                payerCard.appendChild(
                    explanation
                );

                const confirmButton =
                    document.createElement("button");

                confirmButton.type = "button";
                confirmButton.className = "btn";

                const recipientName =
                    appointment.name
                    || "Service Recipient";

                if (payerConfirmed) {
                    setCompletedAction(
                        confirmButton,
                        "Different Payer Confirmed ✓"
                    );
                } else {
                    setPrimaryAction(
                        confirmButton,
                        `Use This Payment for ${recipientName}`
                    );
                }

                confirmButton.addEventListener(
                    "click",
                    function () {
                        squareConfirmedPaymentId =
                            payment.payment_id;

                        squareDifferentPayerConfirmedField
                            .value = "1";

                        squareConfirmedPayerCustomerIdField
                            .value = String(
                                payment.customer_id || ""
                            );

                        payerConfirmed = true;

                        setCompletedAction(
                            confirmButton,
                            "Different Payer Confirmed ✓"
                        );

                        if (nextSquareActionButton) {
                            setPrimaryAction(
                                nextSquareActionButton,
                                nextSquareActionButton
                                    .dataset
                                    .primaryLabel
                            );
                        }
                    }
                );

                payerCard.appendChild(
                    confirmButton
                );

                squarePaymentPreview.appendChild(
                    payerCard
                );
            }

            const status = document.createElement("p");

            if (payment.ready_for_income) {
                status.textContent =
                    "Ready to populate Add Income.";
            } else {
                status.textContent =
                    "Needs review before Add Income can be populated.";
            }

            squarePaymentPreview.appendChild(status);

            const classified = document.createElement("p");

            classified.textContent =
                `Service $${moneyFromCents(
                    payment.service_amount_cents
                )}`
                + ` • Retail $${moneyFromCents(
                    payment.retail_amount_cents
                )}`
                + ` • Unmapped $${moneyFromCents(
                    payment.unknown_amount_cents
                )}`;

            squarePaymentPreview.appendChild(classified);

            const lineHeading = document.createElement("strong");
            lineHeading.textContent = "Square Order Items";
            squarePaymentPreview.appendChild(lineHeading);

            const lineList = document.createElement("div");
            const unmappedSelects = [];

            (payment.line_items || []).forEach(
                function (line) {
                    const lineRow =
                        document.createElement("div");

                    lineRow.style.padding = "6px 0";

                    const itemText =
                        document.createElement("span");

                    itemText.textContent =
                        `${line.name || "Unnamed Item"}`
                        + ` — $${moneyFromCents(
                            line.sale_cents
                        )}`;

                    lineRow.appendChild(itemText);

                    if (line.classification === "unknown") {
                        const select =
                            document.createElement("select");

                        select.style.marginLeft = "8px";
                        select.dataset.lineUid =
                            line.line_uid || "";

                        const blankOption =
                            document.createElement("option");
                        blankOption.value = "";
                        blankOption.textContent =
                            "Classify Item";

                        const serviceOption =
                            document.createElement("option");
                        serviceOption.value = "service";
                        serviceOption.textContent =
                            "Service";

                        const retailOption =
                            document.createElement("option");
                        retailOption.value = "retail";
                        retailOption.textContent =
                            "Retail";

                        select.appendChild(blankOption);
                        select.appendChild(serviceOption);
                        select.appendChild(retailOption);

                        lineRow.appendChild(select);
                        unmappedSelects.push(select);

                    } else {
                        const classification =
                            document.createElement("strong");

                        classification.style.marginLeft =
                            "8px";

                        classification.textContent =
                            line.classification.toUpperCase();

                        lineRow.appendChild(
                            classification
                        );
                    }

                    lineList.appendChild(lineRow);
                }
            );

            squarePaymentPreview.appendChild(lineList);

            if (unmappedSelects.length) {
                const applyButton =
                    document.createElement("button");

                applyButton.type = "button";
                applyButton.className = "btn";
                applyButton.style.marginTop = "10px";
                applyButton.dataset.primaryLabel =
                    "Apply Item Classifications";

                nextSquareActionButton =
                    applyButton;

                if (payerConfirmed) {
                    setPrimaryAction(
                        applyButton,
                        "Apply Item Classifications"
                    );
                } else {
                    setCompletedAction(
                        applyButton,
                        "Confirm Different Payer First"
                    );
                }

                applyButton.addEventListener(
                    "click",
                    function () {
                        const classifications = {};
                        let missing = false;

                        unmappedSelects.forEach(
                            function (select) {
                                if (
                                    !select.dataset.lineUid
                                    || !select.value
                                ) {
                                    missing = true;
                                    return;
                                }

                                classifications[
                                    select.dataset.lineUid
                                ] = select.value;
                            }
                        );

                        if (missing) {
                            squareRetrieveStatus.textContent =
                                "Classify every unmapped Square item "
                                + "as Service or Retail.";
                            return;
                        }

                        squareRetrieveStatus.textContent = "";

                        setCompletedAction(
                            applyButton,
                            "Applying..."
                        );

                        previewSquarePayment(
                            payment.payment_id,
                            classifications
                        );
                    }
                );

                squarePaymentPreview.appendChild(
                    applyButton
                );
            }

            if (payment.ready_for_income) {
                const readyNote =
                    document.createElement("p");

                readyNote.style.marginTop = "12px";
                readyNote.textContent =
                    "Classification complete. "
                    + "Square is ready to populate Add Income.";

                squarePaymentPreview.appendChild(
                    readyNote
                );

                const populateButton =
                    document.createElement("button");

                populateButton.type = "button";
                populateButton.className = "btn";
                populateButton.style.marginTop = "8px";
                populateButton.dataset.primaryLabel =
                    "Populate Add Income";

                nextSquareActionButton =
                    populateButton;

                if (payerConfirmed) {
                    setPrimaryAction(
                        populateButton,
                        "Populate Add Income"
                    );
                } else {
                    setCompletedAction(
                        populateButton,
                        "Confirm Different Payer First"
                    );
                }

                populateButton.addEventListener(
                    "click",
                    function () {
                        incomeTypeField.value =
                            payment.income_type || "";

                        serviceField.value = moneyFromCents(
                            payment.service_amount_cents
                        );

                        retailField.value = moneyFromCents(
                            payment.retail_amount_cents
                        );

                        taxField.value = moneyFromCents(
                            payment.tax_amount_cents
                        );

                        tipField.value = moneyFromCents(
                            payment.tip_amount_cents
                        );

                        creditAppliedField.value = "0.00";

                        paymentMethodField.value = "Square";
                        togglePaymentFields();

                        if (creditProcessorField) {
                            Array.from(
                                creditProcessorField.options
                            ).forEach(function (option) {
                                if (
                                    option.textContent
                                        .trim()
                                        .toLowerCase()
                                    === "square"
                                ) {
                                    creditProcessorField.value =
                                        option.value;
                                }
                            });
                        }

                        processorPaymentField.value =
                            payment.payment_id;

                        squarePaymentIdField.value =
                            payment.payment_id;

                        squareLineClassificationsField.value =
                            JSON.stringify(
                                lineClassifications || {}
                            );

                        togglePaymentFields();

                        setCompletedAction(
                            populateButton,
                            "Square Data Populated ✓"
                        );

                        if (
                            descriptionField
                            && !descriptionField.value.trim()
                        ) {
                            descriptionField.value = (
                                payment.line_items || []
                            )
                                .map(function (line) {
                                    return line.name || "";
                                })
                                .filter(Boolean)
                                .join(", ");
                        }

                        if (
                            notesField
                            && payment.different_square_customer
                            && payerConfirmed
                        ) {
                            const payerName =
                                payment.possible_payer_name
                                || "another Square customer";

                            const recipientName =
                                appointment.name
                                || "the service recipient";

                            const payerNote =
                                "Square payment associated with "
                                + payerName
                                + " confirmed for service recipient "
                                + recipientName
                                + ".";

                            const existingNotes =
                                notesField.value.trim();

                            if (
                                !existingNotes.includes(
                                    payerNote
                                )
                            ) {
                                notesField.value =
                                    existingNotes
                                    ? existingNotes
                                        + "\n"
                                        + payerNote
                                    : payerNote;

                                squareGeneratedPayerNote =
                                    payerNote;
                            }
                        }

                        calculateTotal();

                        squareRetrieveStatus.textContent =
                            "Square data populated. Review the "
                            + "Income form, then save. PSP will "
                            + "re-verify the Square transaction "
                            + "before anything is written.";
                    }
                );

                squarePaymentPreview.appendChild(
                    populateButton
                );
            }

        } catch (error) {
            squarePaymentPreview.textContent =
                error.message
                || "Unable to review Square payment.";

            if (reviewButton) {
                setPrimaryAction(
                    reviewButton,
                    "Review Payment Again"
                );
            }
        }
    }

    async function retrieveSquareData() {
        if (
            !retrieveSquareButton
            || !squareRetrieveStatus
            || !squarePaymentCandidates
        ) {
            return;
        }

        setCompletedAction(
            retrieveSquareButton,
            "Checking Square..."
        );

        squareRetrieveStatus.textContent =
            "Checking Square for recent payments...";

        squarePaymentCandidates.textContent = "";
        squareReviewButtons = [];
        clearSquarePayerConfirmation();

        if (squarePaymentPreview) {
            squarePaymentPreview.textContent = "";
        }

        clearSquarePopulatedState();
        togglePaymentFields();

        try {
            const response = await fetch(
                "{{ url_for(
                    'square_recent_payments_for_income',
                    appointment_id=appt[0]
                ) }}"
            );

            const data = await response.json();

            if (!response.ok || !data.ok) {
                throw new Error(
                    data.error
                    || "Unable to retrieve Square payments."
                );
            }

            const payments = data.payments || [];

            if (!payments.length) {
                squareRetrieveStatus.textContent =
                    "No recent completed Square payments found.";
                return;
            }

            squareRetrieveStatus.textContent =
                `Found ${payments.length} recent completed Square payment`
                + (payments.length === 1 ? "." : "s.");

            payments.forEach(function (payment) {
                const row = document.createElement("div");
                row.style.padding = "8px 0";
                row.style.borderBottom = "1px solid #ddd";

                const total = (
                    (payment.total_cents || 0) / 100
                ).toFixed(2);

                const fee = (
                    (payment.processing_fee_cents || 0) / 100
                ).toFixed(2);

                let created = payment.created_at || "";

                if (created) {
                    const parsedDate = new Date(created);

                    if (!Number.isNaN(parsedDate.getTime())) {
                        created = parsedDate.toLocaleString();
                    }
                }

                const text = document.createElement("span");

                text.textContent =
                    `${created} — $${total}`
                    + ` — Fee $${fee}`;

                if (payment.different_square_customer) {
                    text.textContent +=
                        ` — Possible Payer: `
                        + (
                            payment.possible_payer_name
                            || "Different Square Customer"
                        );
                }

                text.textContent += " ";

                const reviewButton =
                    document.createElement("button");

                reviewButton.type = "button";
                reviewButton.className = "btn";
                reviewButton.textContent = "Review Payment";

                squareReviewButtons.push(reviewButton);

                if (squareReviewButtons.length === 1) {
                    setPrimaryAction(
                        reviewButton,
                        "Review Payment"
                    );
                } else {
                    setSecondaryAction(
                        reviewButton,
                        "Review Payment"
                    );
                }

                reviewButton.addEventListener(
                    "click",
                    function () {
                        resetSquareReviewButtons();

                        setCompletedAction(
                            reviewButton,
                            "Reviewing..."
                        );

                        previewSquarePayment(
                            payment.payment_id,
                            null,
                            reviewButton
                        );
                    }
                );

                row.appendChild(text);
                row.appendChild(reviewButton);

                squarePaymentCandidates.appendChild(row);
            });

        } catch (error) {
            squareRetrieveStatus.textContent =
                error.message
                || "Unable to retrieve Square payments.";

        } finally {
            if (squareReviewButtons.length) {
                setSecondaryAction(
                    retrieveSquareButton,
                    "Refresh Square Data"
                );
            } else {
                setPrimaryAction(
                    retrieveSquareButton,
                    "Check Square Again"
                );
            }
        }
    }

    serviceField.addEventListener("input", calculateTotal);
    retailField.addEventListener("input", calculateTotal);
    taxField.addEventListener("input", calculateTotal);
    tipField.addEventListener("input", calculateTotal);
    creditAppliedField.addEventListener("input", calculateTotal);

    paymentMethodField.addEventListener(
        "change",
        function () {
            const paymentMethod =
                paymentMethodField.value.trim().toLowerCase();

            clearSquarePopulatedState();
            clearSquarePayerConfirmation();

            if (paymentMethod === "square") {
                // Do not carry a manually selected card
                // processor into a new Square retrieval.
                if (creditProcessorField) {
                    creditProcessorField.value = "";
                }

                if (retrieveSquareButton) {
                    setPrimaryAction(
                        retrieveSquareButton,
                        "Retrieve Square Data"
                    );
                }
            } else {
                if (retrieveSquareButton) {
                    setPrimaryAction(
                        retrieveSquareButton,
                        "Retrieve Square Data"
                    );
                }

                squareReviewButtons = [];

                if (squarePaymentCandidates) {
                    squarePaymentCandidates.textContent = "";
                }

                if (squarePaymentPreview) {
                    squarePaymentPreview.textContent = "";
                }

                if (squareRetrieveStatus) {
                    squareRetrieveStatus.textContent = "";
                }
            }

            togglePaymentFields();
        }
    );

    if (retrieveSquareButton) {
        retrieveSquareButton.addEventListener(
            "click",
            retrieveSquareData
        );
    }

    const preselectedSquarePaymentId =
        {{ preselected_square_payment_id|tojson }};

    calculateTotal();
    togglePaymentFields();

    if (
        preselectedSquarePaymentId
        && paymentMethodField
        && squarePaymentPreview
        && squareRetrieveStatus
    ) {
        paymentMethodField.value = "Square";
        togglePaymentFields();

        squareRetrieveStatus.textContent =
            "Square payment selected from reconciliation. "
            + "Review it below before populating Add Income.";

        if (retrieveSquareButton) {
            setSecondaryAction(
                retrieveSquareButton,
                "Refresh Square Data"
            );
        }

        previewSquarePayment(
            preselectedSquarePaymentId
        );
    }
});
</script>



{% endblock %}
