<div class="user-menu app-menu-category">

    <button type="button"
            class="user-menu-button app-menu-category-button"
            onclick="toggleHelpMenu()">

        <span class="app-menu-category-main">

            <span class="app-menu-category-icon"
                  aria-hidden="true">
                ❓
            </span>

            <span class="app-menu-category-label">
                Help & Support
            </span>

        </span>

        <span class="app-menu-category-chevron"
              aria-hidden="true">
            ›
        </span>

    </button>


    <div id="helpMenuDropdown"
         class="user-menu-dropdown app-menu-submenu"
         style="display:none;">


        <!-- Search and Help -->
        <div class="app-menu-submenu-section">

            <div class="app-menu-submenu-heading">
                🔍 Find Help
            </div>

            <button type="button"
                    class="app-menu-submenu-action"
                    onclick="openQLaunch()">

                <span aria-hidden="true">⚡️</span>
                <span>Search with Q Launch</span>

            </button>

            <button type="button"
                    class="app-menu-submenu-action"
                    onclick="
                        openPeachHelpModal();
                        return false;
                    ">

                <span aria-hidden="true">📚</span>
                <span>Help & Knowledge Base</span>

            </button>

            <a href="{{ url_for('help_center') }}">
                <span aria-hidden="true">❓</span>
                <span>Help Center</span>
            </a>

        </div>


        <div class="user-menu-divider"></div>


        <!-- Product Information -->
        <div class="app-menu-submenu-section">

            <div class="app-menu-submenu-heading">
                🍑 Peach Suite Pro
            </div>

            <button type="button"
                    class="app-menu-submenu-action"
                    onclick="
                        openAboutPeachSuiteModal();
                        return false;
                    ">

                <span aria-hidden="true">ℹ️</span>
                <span>About Peach Suite Pro</span>

            </button>

        </div>


        <div class="user-menu-divider"></div>


        <!-- Feedback -->
        <div class="app-menu-submenu-section">

            <div class="app-menu-submenu-heading">
                💬 Feedback
            </div>

            <a href="{{ url_for('feedback') }}">
                <span aria-hidden="true">📝</span>
                <span>Send Feedback</span>
            </a>

        </div>

    </div>

</div>
