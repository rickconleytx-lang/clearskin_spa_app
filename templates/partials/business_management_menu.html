<div class="user-menu app-menu-category">

    <button type="button"
            class="user-menu-button app-menu-category-button"
            onclick="toggleBusinessManagementMenu()">

        <span class="app-menu-category-main">

            <span class="app-menu-category-icon"
                  aria-hidden="true">
                🗂️
            </span>

            <span class="app-menu-category-label">
                Business Management
            </span>

        </span>

        <span class="app-menu-category-chevron"
              aria-hidden="true">
            ›
        </span>

    </button>


    <div id="businessManagementMenuDropdown"
         class="user-menu-dropdown app-menu-submenu"
         style="display:none;">


       
        <!-- Business Operations -->
        <div class="app-menu-submenu-section">

            <div class="app-menu-submenu-heading">
                🍑 Business Operations
            </div>

            <a href="{{ url_for(
                'business_coach_profile'
            ) }}">
                <span aria-hidden="true">🏢</span>
                <span>Business Profile</span>
            </a>

            <a href="{{ url_for('business_schedule') }}">
                <span aria-hidden="true">🗓️</span>
                <span>Business Schedule & Reminders</span>
            </a>

        </div>


        <div class="user-menu-divider"></div>


        <!-- Business Settings -->
        <div class="app-menu-submenu-section">

            <div class="app-menu-submenu-heading">
                ⚙️ Business Settings
            </div>

            <a href="{{ url_for('business_goals') }}">
                <span aria-hidden="true">🎯</span>
                <span>My Business Goals</span>
            </a>

            <a href="{{ url_for('admin') }}">
                <span aria-hidden="true">🛠️</span>
                <span>Admin Settings</span>
            </a>

{% if nav_access.can_manage_security_settings %}
<a href="{{ url_for('login_security_settings') }}">
    <span aria-hidden="true">🔐</span>
    <span>Login Security</span>
</a>
{% endif %}

        <a href="{{ url_for('help_center') }}">
            <span aria-hidden="true">❓</span>
            <span>Help Center</span>
        </a>

        </div>


            

    </div>

</div>
